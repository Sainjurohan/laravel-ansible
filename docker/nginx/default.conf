upstream laravel_cluster {
    # Here, laravel_app is supposed to be the hostname of docekr container. Thus,
    # docker contaienr's service must be named laravel_app in docker-compose.yml
    server laravel_app1:9000;
    server laravel_app2:9000;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html/todo/public;


    index index.php index.html index.htm;

    error_log  /var/log/nginx/laravel-ansible-error.log;
    access_log /var/log/nginx/laravel-ansible-access.log;
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # include fastcgi.conf;
        include fastcgi_params;
        # Here, laravel_app is supposed to be the hostname of docekr container. Thus,
        # docker contaienr's service must be named laravel_app in docker-compose.yml
        # fastcgi_pass laravel_app:9000;

        # Connect to PHP-FPM via TCP/IP
        fastcgi_pass laravel_cluster;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}