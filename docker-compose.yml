services:
  app:
    build: 
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    working_dir: /var/www/html/todo
    volumes:
      - app_data:/var/www/html/todo
    environment:
      - APP_ENV=local
    networks:
      - bridge

  webserver:
    build: 
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: nginx
    ports:
      - "5111:80"
    volumes:
      - app_data:/var/www/html/todo
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - bridge

networks:
  bridge:
    driver: bridge

volumes:
  app_data:       